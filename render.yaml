previews:
  generation: off

services:
  - type: web
    name: clinic-booking-api
    runtime: python
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: CLINIC_APP_ENV
        value: production
      - key: CLINIC_DEBUG
        value: "false"
      - key: CLINIC_DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
      - key: CLINIC_TIMEZONE
        value: Africa/Nairobi
      - key: CLINIC_JWT_SECRET
        sync: false
      - key: CLINIC_JWT_ALGORITHM
        value: HS256
      - key: CLINIC_JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

databases:
  - name: clinic-booking-db
    databaseName: clinic_booking
    user: clinic_user
